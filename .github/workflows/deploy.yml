name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so each doc's last-updated date (shown on the page and
          # sent as the sitemap's lastmod) comes from its own last commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Tells search engines that use IndexNow (Bing and others) which pages exist, right after each
      # deploy, so changes are picked up in hours. The key is public: its file sits at the site root.
      - name: Notify IndexNow
        continue-on-error: true
        env:
          HOST: kashcal.onekash.org
          INDEXNOW_KEY: 84e914c8ca693d73597023619b1d3525
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          host, key = os.environ['HOST'], os.environ['INDEXNOW_KEY']
          sitemap = urllib.request.urlopen(f'https://{host}/sitemap.xml').read().decode()
          urls = re.findall(r'<loc>([^<]+)</loc>', sitemap)
          body = json.dumps({'host': host, 'key': key, 'keyLocation': f'https://{host}/{key}.txt', 'urlList': urls}).encode()
          request = urllib.request.Request('https://api.indexnow.org/indexnow', data=body, headers={'Content-Type': 'application/json; charset=utf-8'})
          print(urllib.request.urlopen(request).status, len(urls), 'URLs')
          PY
